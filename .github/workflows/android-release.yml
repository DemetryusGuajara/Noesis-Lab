name: Build APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env exists for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Setup fixed signing key (stable signature across builds)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS_V: ${{ secrets.KEY_ALIAS }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > fixed-test.keystore
            echo "FIXED_KEYSTORE_PATH=$PWD/fixed-test.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$PWD/fixed-test.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PW" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_V" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PW" >> $GITHUB_ENV
          else
            echo "No fixed signing key configured; using debug.keystore fallback."
          fi

      - name: Build Debug APK + Release AAB
        run: gradle assembleDebug bundleRelease --no-daemon

      - name: Rename APKs for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NoesisLab-v1.0.${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab NoesisLab-v1.0.${{ github.run_number }}-release.aab

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        # Non-blocking: o APK/AAB já vai para os assets da Release abaixo;
        # se a cota de artefatos estourar, a run continua verde mesmo assim.
        continue-on-error: true
        with:
          name: NoesisLab-APKs
          retention-days: 7
          path: |
            NoesisLab-v1.0.${{ github.run_number }}.apk
            NoesisLab-v1.0.${{ github.run_number }}-release.aab

      - name: Create GitHub Release and Attach APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Noesis Lab v1.0.${{ github.run_number }}"
          body: |
            ### Noesis Lab — Build Automático (#${{ github.run_number }})
            - **Commit:** `${{ github.sha }}`
            - **APK oficial (com diagnóstico):** Baixe o arquivo `NoesisLab-v1.0.${{ github.run_number }}.apk` abaixo em **Assets**. Em Ajustes → Diagnóstico e logs você pode exportar o log após qualquer travamento.
            - **Pacote da Play Store:** `NoesisLab-v1.0.${{ github.run_number }}-release.aab` — assinado com a chave própria, `versionCode` crescente. Quando criar a conta de desenvolvedor, suba este AAB (mesmo pacote e mesma chave, sempre).
          files: |
            NoesisLab-v1.0.${{ github.run_number }}.apk
            NoesisLab-v1.0.${{ github.run_number }}-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
